server:
  port: 8085

spring:
  application:
    name: ms-comunicaciones
  datasource:
    url: jdbc:postgresql://localhost:5432/db_comunicaciones
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    consumer:
      group-id: comunicaciones-alertas
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: calificacion:cl.bernardo.ohiggins.ms_comunicaciones.dto.CalificacionRegistradaEvent,asistencia:cl.bernardo.ohiggins.ms_comunicaciones.dto.AsistenciaRegistradaEvent
        spring.json.trusted.packages: cl.bernardo.ohiggins.ms_comunicaciones.dto
    listener:
      ack-mode: record

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

mensajeria:
  exchange: libro-digital-exchange
  dlx: libro-digital-dlx
  asistencia:
    routing-key: libro.asistencia.registrada
    cola: comunicaciones-asistencia-queue
    dlq: comunicaciones-asistencia-dlq
  calificacion-notificacion:
    routing-key: libro.calificacion.notificacion
    cola: comunicaciones-calificacion-queue
    dlq: comunicaciones-calificacion-dlq
  hoja-vida:
    routing-key: libro.hojavida.registrada
    cola: comunicaciones-hojavida-queue
    dlq: comunicaciones-hojavida-dlq

kafka:
  topicos:
    calificaciones: libro.calificaciones.eventos
    asistencia: libro.asistencia.eventos
    calificaciones-dlt: libro.calificaciones.eventos.DLT
    asistencia-dlt: libro.asistencia.eventos.DLT