server:
  port: 8085

spring:
  application:
    name: ms-comunicaciones
  datasource:
    url: jdbc:postgresql://localhost:5432/db_comunicaciones
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true