server:
  port: 8086

spring:
  application:
    name: ms-reportes
  datasource:
    url: jdbc:postgresql://localhost:5432/db_reportes
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    consumer:
      group-id: reportes-analitica
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: calificacion:cl.bernardo.ohiggins.ms_reportes.dto.CalificacionRegistradaEvent,asistencia:cl.bernardo.ohiggins.ms_reportes.dto.AsistenciaRegistradaEvent
        spring.json.trusted.packages: cl.bernardo.ohiggins.ms_reportes.dto
    listener:
      ack-mode: record

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

mensajeria:
  exchange: libro-digital-exchange
  dlx: libro-digital-dlx
  calificacion-reporte:
    routing-key: libro.calificacion.reporte
    cola: reportes-calificacion-queue
    dlq: reportes-calificacion-dlq

    reportes:
  generador-por-defecto: 1

kafka:
  topicos:
    calificaciones: libro.calificaciones.eventos
    asistencia: libro.asistencia.eventos
    calificaciones-dlt: libro.calificaciones.eventos.DLT
    asistencia-dlt: libro.asistencia.eventos.DLT