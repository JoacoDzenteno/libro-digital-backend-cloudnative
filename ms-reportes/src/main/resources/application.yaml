server:
  port: 8086

spring:
  application:
    name: ms-reportes
  datasource:
    url: jdbc:postgresql://localhost:5432/db_reportes
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

mensajeria:
  exchange: libro-digital-exchange
  dlx: libro-digital-dlx
  calificacion-reporte:
    routing-key: libro.calificacion.reporte
    cola: reportes-calificacion-queue
    dlq: reportes-calificacion-dlq

    reportes:
  generador-por-defecto: 1