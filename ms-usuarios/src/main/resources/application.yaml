server:
  port: 8081

spring:
  application:
    name: ms-usuarios
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/1148f910-11c6-41a3-94d3-dedca0cefa9c/v2.0

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  jwt:
    secret: claveSecretaSuperSeguraParaDesarrolloLocal123456
    expiration: 86400000
  audience: 3ac3ede1-1d05-42df-8248-3fbde4240a87