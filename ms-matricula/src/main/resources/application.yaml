server:
  port: 8083

spring:
  application:
    name: ms-matricula
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_matricula}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true