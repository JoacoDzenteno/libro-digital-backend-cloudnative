server:
  port: 8083

spring:
  application:
    name: ms-matricula
  datasource:
    url: jdbc:postgresql://localhost:5432/db_matricula
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false